name: "[1.1] Terraform Operations"

run-name: "TF Ops - ${{ github.event.inputs.tf_operation }}"

on:
  workflow_dispatch:
    inputs:
      tf_operation:
        description: "Terraform operation"
        required: true
        default: "Release Lock"
        type: choice
        options:
          - Release Lock
          - Import Resource

      state_key_path:
        description: "S3 Terraform State Key Path"
        required: true
        default: "<environment>/<module>/.../terragrunt.tfstate"
        type: string

      terragrunt_module_dir:
        description: "Terragrunt Module Directory"
        required: false
        default: "<PROJECT>/<environment>/<region>/.../<module>"
        type: string

      resource_address:
        description: "TF Resource Address"
        required: false
        default: "aws_s3_bucket.my_example_bucket[0]"
        type: string

      resource_id:
        description: "Import ID"
        required: false
        default: "kube-system/aws-load-balancer-controller"
        type: string

env:
  TERRAGRUNT_BACKEND_S3_BUCKET: ${{ vars.TERRAGRUNT_BACKEND_S3_BUCKET }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  RELEASE_LOCK_SCRIPT: script/1.1.0.terraform-operations/remove_tf_lock.sh
  IMPORT_RESOURCE_SCRIPT: script/1.1.0.terraform-operations/import_tf_resource.sh

jobs:
  terraform-operations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify workflow inputs
        run: |
          echo "Terraform operation: ${{ github.event.inputs.tf_operation }}"
          echo "State key path: ${{ github.event.inputs.state_key_path }}"
          echo "Backend S3 bucket: $TERRAGRUNT_BACKEND_S3_BUCKET"
          echo "Terragrunt module dir: ${{ github.event.inputs.terragrunt_module_dir }}"
          echo "Resource address: ${{ github.event.inputs.resource_address }}"
          echo "Resource ID: ${{ github.event.inputs.resource_id }}"

      - name: Setup Terragrunt CLI
        uses: ./.github/actions/terragrunt-setup

      - name: Release Terraform S3 lock
        if: ${{ github.event.inputs.tf_operation == 'Release Lock' }}
        run: |
          ./$RELEASE_LOCK_SCRIPT \
            "$TERRAGRUNT_BACKEND_S3_BUCKET" \
            "${{ github.event.inputs.state_key_path }}"

      - name: Import Terragrunt resource
        if: ${{ github.event.inputs.tf_operation == 'Import Resource' }}
        run: |
          ./$IMPORT_RESOURCE_SCRIPT \
            "${{ github.event.inputs.terragrunt_module_dir }}" \
            "${{ github.event.inputs.resource_address }}" \
            "${{ github.event.inputs.resource_id }}"
