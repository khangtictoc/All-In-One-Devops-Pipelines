name: "[3.0] Onboard AWS Account to S3 Bucket"

run-name: "[3.0] Onboard AWS Account to S3 Bucket (Account ID: ${{ inputs.accountID }})"

on:
  workflow_dispatch:
    inputs:
      accountID:
        description: "AWS Account ID to grant access"
        required: true
        type: string
      bucketNameVeleroBackup:
        description: "S3 Bucket Name for Velero Backup"
        required: true
        type: string
        default: "velero-backup-kubernetes-aws-d89fgh"
      bucketNameTFInput:
        description: "S3 Bucket Name for Terraform Input"
        required: true
        type: string
        default: "terragrunt-input"
      region:
        description: "AWS Region"
        required: true
        type: string
        default: "us-east-1"

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.ADMIN_AWS_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.ADMIN_AWS_SECRET_KEY }}

  ACCOUNT_ID: ${{ inputs.accountID }}
  BUCKET_NAME_VELERO_BACKUP: ${{ inputs.bucketNameVeleroBackup }}
  BUCKET_NAME_TF_INPUT: ${{ inputs.bucketNameTFInput }}
  REGION: ${{ inputs.region }}

jobs:
  onboard-account-velero-backup-bucket:
    runs-on: ubuntu-latest

    steps:
      - name: Add new account to bucket policy
        run: |


          # Try to get current bucket policy
          if aws s3api get-bucket-policy --bucket "$BUCKET_NAME_VELERO_BACKUP" --region "$REGION" --output json > current-policy.json 2>/dev/null; then
            echo "✅ Existing policy found"
            POLICY=$(cat current-policy.json | jq '.Policy | fromjson')
          else
            echo "⚠️  No existing policy, creating new one"
            # Create empty policy structure
            POLICY='{
              "Version": "2012-10-17",
              "Statement": []
            }'
          fi

          # Check if account already exists
          EXISTING=$(echo "$POLICY" | jq --arg account_id "$ACCOUNT_ID" '.Statement[] | select(.Principal.AWS | contains("arn:aws:iam::" + $account_id + ":root"))' 2>/dev/null)

          if [ -n "$EXISTING" ]; then
            echo "Account $ACCOUNT_ID already has access; nothing to do"
            exit 0
          fi

          # Add new statement to policy
          NEW_POLICY=$(echo "$POLICY" | jq \
            --arg account_id "$ACCOUNT_ID" \
            --arg bucket_name "$BUCKET_NAME_VELERO_BACKUP" \
            '.Statement += [{
              "Effect": "Allow",
              "Principal": {
                "AWS": ("arn:aws:iam::" + $account_id + ":root")
              },
              "Action": [
                "s3:GetObject",
                "s3:ListBucket",
                "s3:GetObjectTagging"
              ],
              "Resource": [
                ("arn:aws:s3:::" + $bucket_name),
                ("arn:aws:s3:::" + $bucket_name + "/*")
              ]
            }]')

          # Apply new policy
          echo "$NEW_POLICY" | aws s3api put-bucket-policy \
            --bucket "$BUCKET_NAME_VELERO_BACKUP" \
            --region "$REGION" \
            --policy file:///dev/stdin

          echo "✅ Account $ACCOUNT_ID added to bucket policy"

      - name: Verify policy update
        run: |
          aws s3api get-bucket-policy \
            --bucket "$BUCKET_NAME_VELERO_BACKUP" \
            --region "$REGION" \
            --output json | jq --arg account_id "$ACCOUNT_ID" \
            '.Policy | fromjson | .Statement[] | select(.Principal.AWS | contains($account_id))'

  onboard-account-tf-input-bucket:
    runs-on: ubuntu-latest

    steps:
      - name: Add new account to bucket policy
        run: |

          # Try to get current bucket policy
          if aws s3api get-bucket-policy --bucket "$BUCKET_NAME_TF_INPUT" --region "$REGION" --output json > current-policy.json 2>/dev/null; then
            echo "✅ Existing policy found"
            POLICY=$(cat current-policy.json | jq '.Policy | fromjson')
          else
            echo "⚠️  No existing policy, creating new one"
            # Create empty policy structure
            POLICY='{
              "Version": "2012-10-17",
              "Statement": []
            }'
          fi

          # Check if account already exists
          EXISTING=$(echo "$POLICY" | jq --arg account_id "$ACCOUNT_ID" '.Statement[] | select(.Principal.AWS | contains("arn:aws:iam::" + $account_id + ":root"))' 2>/dev/null)

          if [ -n "$EXISTING" ]; then
            echo "Account $ACCOUNT_ID already has access; nothing to do"
            exit 0
          fi

          # Add new statement to policy
          NEW_POLICY=$(echo "$POLICY" | jq \
            --arg account_id "$ACCOUNT_ID" \
            --arg bucket_name "$BUCKET_NAME_TF_INPUT" \
            '.Statement += [{
              "Effect": "Allow",
              "Principal": {
                "AWS": ("arn:aws:iam::" + $account_id + ":root")
              },
              "Action": [
                "s3:GetObject",
                "s3:ListBucket",
                "s3:GetObjectTagging"
              ],
              "Resource": [
                ("arn:aws:s3:::" + $bucket_name),
                ("arn:aws:s3:::" + $bucket_name + "/*")
              ]
            }]')

          # Apply new policy
          echo "$NEW_POLICY" | aws s3api put-bucket-policy \
            --bucket "$BUCKET_NAME_TF_INPUT" \
            --region "$REGION" \
            --policy file:///dev/stdin

          echo "✅ Account $ACCOUNT_ID added to bucket policy"

      - name: Verify policy update
        run: |
          aws s3api get-bucket-policy \
            --bucket "$BUCKET_NAME_TF_INPUT" \
            --region "$REGION" \
            --output json | jq --arg account_id "$ACCOUNT_ID" \
            '.Policy | fromjson | .Statement[] | select(.Principal.AWS | contains($account_id))'
