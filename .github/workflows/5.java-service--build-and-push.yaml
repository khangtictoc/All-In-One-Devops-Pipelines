name: "[5.0] Java Service - Build and Push"

run-name: >-
  Java Service - ${{ inputs.dockerfile_folder }} - ${{ inputs.branch_override || inputs.branch }}

on:
  workflow_dispatch:
    inputs:
      git_repository:
        description: "Repository"
        required: true
        default: "https://github.com/your-org/service-a.git"
        type: choice
        options:
          - https://github.com/your-org/service-a.git
          - https://github.com/your-org/service-b.git
          - https://github.com/your-org/service-c.git
          - https://gitlab.com/nab3735908/demo-project/java-service.git

      branch:
        description: "Branch"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - production

      branch_override:
        description: "Optional branch override"
        required: false
        default: ""
        type: string

      dockerfile_folder:
        description: "Dockerfile to build"
        required: true
        default: "java-service"
        type: choice
        options:
          - java-service
          - jenkins-inbound-agent

      skip_unit_tests:
        description: "Skip the Docker builder-stage tests"
        required: true
        default: false
        type: boolean

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERFILE_REPOSITORY: ${{ vars.DOCKERFILE_REPOSITORY }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Resolve build parameters
        id: parameters
        shell: bash
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_BRANCH_OVERRIDE: ${{ inputs.branch_override }}
          INPUT_REPOSITORY: ${{ inputs.git_repository }}
        run: |
          set -euo pipefail

          target_branch="${INPUT_BRANCH_OVERRIDE//[[:space:]]/}"
          target_branch="${target_branch:-$INPUT_BRANCH}"
          service_name="$(basename "${INPUT_REPOSITORY%.git}" | tr '[:upper:]' '[:lower:]')"
          safe_branch="$(printf '%s' "$target_branch" | tr '/:' '--' | tr -cd '[:alnum:]_.-')"

          if [[ -z "$service_name" || -z "$safe_branch" ]]; then
            echo "Unable to resolve a valid service name or Docker tag." >&2
            exit 1
          fi

          {
            echo "target_branch=$target_branch"
            echo "service_name=$service_name"
            echo "image_name=$DOCKERHUB_USERNAME/$service_name"
            echo "git_repository=$INPUT_REPOSITORY"
            echo "image_tag=$safe_branch-${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout application source
        id: application
        env:
          GIT_REPOSITORY: ${{ steps.parameters.outputs.git_repository }}
          TARGET_BRANCH: ${{ steps.parameters.outputs.target_branch }}
        run: |
          git clone --branch "$TARGET_BRANCH" --single-branch "$GIT_REPOSITORY" app-source
          echo "git_commit=$(git -C app-source rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout Dockerfile
        env:
          DOCKERFILE_FOLDER: ${{ inputs.dockerfile_folder }}
        run: |
          git clone --single-branch "$DOCKERFILE_REPOSITORY" dockerfile-common
          cp "dockerfile-common/$DOCKERFILE_FOLDER/Dockerfile" app-source/Dockerfile

      - name: Run unit tests
        if: ${{ !inputs.skip_unit_tests }}
        run: |
          docker build \
            --target builder \
            --build-arg RUN_TESTS=true \
            --file app-source/Dockerfile \
            app-source

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app-source
          file: ./app-source/Dockerfile
          push: true
          build-args: |
            BUILD_NUMBER=${{ github.run_number }}
            GIT_COMMIT=${{ steps.application.outputs.git_commit }}
          tags: |
            ${{ steps.parameters.outputs.image_name }}:${{ steps.parameters.outputs.image_tag }}
            ${{ steps.parameters.outputs.image_name }}:latest

      - name: Build summary
        run: |
          {
            echo "### Java service image published"
            echo "- Repository: ${{ steps.parameters.outputs.git_repository }}"
            echo "- Branch: ${{ steps.parameters.outputs.target_branch }}"
            echo "- Image: ${{ steps.parameters.outputs.image_name }}:${{ steps.parameters.outputs.image_tag }}"
            echo "- Tests: ${{ inputs.skip_unit_tests && 'Skipped' || 'Passed' }}"
          } >> "$GITHUB_STEP_SUMMARY"
