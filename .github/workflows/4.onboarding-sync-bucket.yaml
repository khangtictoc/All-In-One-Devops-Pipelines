name: "[4.0] S3 Cross-Account Sync"

on:
  workflow_dispatch:
    inputs:
      source_bucket_velero_backup:
        description: "Source S3 bucket name"
        required: false
        type: string
        default: velero-backup-kubernetes-aws-d89fgh
      dest_bucket_velero_backup:
        description: "Destination S3 bucket name"
        required: false
        type: string
        default: velero-backup-kubernetes-aws-454879
      source_bucket_tf_input:
        description: "Source S3 bucket name"
        required: false
        type: string
        default: velero-backup-kubernetes-aws-d89fgh
      dest_bucket_tf_input:
        description: "Destination S3 bucket name"
        required: false
        type: string
        default: velero-backup-kubernetes-aws-454879
      region:
        description: "AWS region"
        required: false
        type: choice
        options:
          - us-east-1
          - us-west-2
          - eu-west-1
        default: us-east-1
      dry_run:
        description: "Run in dry-run mode (preview changes only)"
        required: false
        type: boolean
        default: true

env:
  SOURCE_BUCKET_VELERO_BACKUP: ${{ github.event.inputs.source_bucket_velero_backup }}
  DEST_BUCKET_VELERO_BACKUP: ${{ github.event.inputs.dest_bucket_velero_backup }}
  SOURCE_BUCKET_TF_INPUT: ${{ github.event.inputs.source_bucket_tf_input }}
  DEST_BUCKET_TF_INPUT: ${{ github.event.inputs.dest_bucket_tf_input }}

  AWS_REGION: ${{ github.event.inputs.region }}
  DRY_RUN: ${{ github.event.inputs.dry_run }}
  AWS_PAGER: ""

jobs:
  s3-sync-velero-backup-bucket:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS credentials
        run: |
          echo "Verifying AWS credentials by getting caller identity"
          aws sts get-caller-identity

      - name: Verify source bucket list access
        run: |
          echo "Verifying source bucket list access"
          aws s3 ls "s3://$SOURCE_BUCKET_VELERO_BACKUP" --region "$AWS_REGION"

      - name: Verify target bucket write/delete test
        run: |
          TEST_FILE="/tmp/s3-target-test-$(date +%s).txt"
          TARGET_KEY=".workflow-tests/test.txt"
          echo "s3 target test" > "$TEST_FILE"

          echo "Uploading test file to target bucket"
          aws s3 cp "$TEST_FILE" "s3://$DEST_BUCKET_VELERO_BACKUP/$TARGET_KEY" --region "$AWS_REGION"

          echo "Deleting test file from target bucket"
          aws s3 rm "s3://$DEST_BUCKET_VELERO_BACKUP/$TARGET_KEY" --region "$AWS_REGION"

          rm -f "$TEST_FILE"

      - name: Sync source to destination
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: showing what would be synced"
            aws s3 sync "s3://$SOURCE_BUCKET_VELERO_BACKUP" "s3://$DEST_BUCKET_VELERO_BACKUP" --region "$AWS_REGION" --dryrun
          else
            echo "Running actual sync"
            aws s3 sync "s3://$SOURCE_BUCKET_VELERO_BACKUP" "s3://$DEST_BUCKET_VELERO_BACKUP" --region "$AWS_REGION"
          fi

  s3-sync-input-bucket:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS credentials
        run: |
          echo "Verifying AWS credentials by getting caller identity"
          aws sts get-caller-identity

      - name: Verify source bucket list access
        run: |
          echo "Verifying source bucket list access"
          aws s3 ls "s3://$SOURCE_BUCKET_TF_INPUT" --region "$AWS_REGION"

      - name: Verify target bucket write/delete test
        run: |
          TEST_FILE="/tmp/s3-target-test-$(date +%s).txt"
          TARGET_KEY=".workflow-tests/test.txt"
          echo "s3 target test" > "$TEST_FILE"

          echo "Uploading test file to target bucket"
          aws s3 cp "$TEST_FILE" "s3://$DEST_BUCKET_TF_INPUT/$TARGET_KEY" --region "$AWS_REGION"

          echo "Deleting test file from target bucket"
          aws s3 rm "s3://$DEST_BUCKET_TF_INPUT/$TARGET_KEY" --region "$AWS_REGION"

          rm -f "$TEST_FILE"

      - name: Sync source to destination
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: showing what would be synced"
            aws s3 sync "s3://$SOURCE_BUCKET_TF_INPUT" "s3://$DEST_BUCKET_TF_INPUT" --region "$AWS_REGION" --dryrun
          else
            echo "Running actual sync"
            aws s3 sync "s3://$SOURCE_BUCKET_TF_INPUT" "s3://$DEST_BUCKET_TF_INPUT" --region "$AWS_REGION"
          fi
